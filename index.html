<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NURO光 工事・特典スケジュール計算</title>
  <style>
    :root{--main:#83ad2e;--pale:#f3f8e8;--ink:#172019;--line:#ced8d1}
    *{box-sizing:border-box}body{margin:0;background:#f3f6f4;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}header{background:#101713;color:#fff;padding:23px}header>div,main{max-width:1120px;margin:auto}.tag{color:#bce47b;font-size:12px;font-weight:700;letter-spacing:.15em}h1{margin:4px 0 6px;font-size:27px}header p{margin:0;color:#cad2cd;font-size:14px}main{display:grid;grid-template-columns:350px 1fr;gap:24px;padding:27px 20px}.card{background:#fff;border:1px solid #d7e0da;border-radius:16px;box-shadow:0 2px 8px #1835230b;overflow:hidden}.input{padding:21px}h2{margin:0;font-size:20px}fieldset{border:0;padding:0;margin:20px 0 0}legend,label{font-size:14px;font-weight:700}.choices{display:grid;gap:8px;margin-top:8px}.campaigns{grid-template-columns:1fr 1fr}.antenna{grid-template-columns:1fr 1fr}.choices button{padding:12px 8px;border:1px solid #d7e0da;border-radius:11px;background:#fff;font-weight:700;cursor:pointer}.choices button.on{border-color:var(--main);background:var(--pale);color:#26351d;box-shadow:0 0 0 2px color-mix(in srgb,var(--main) 18%,transparent)}label{display:block;margin-top:20px}input{width:100%;margin-top:8px;padding:12px;border:1px solid #b9c8bf;border-radius:12px;font-size:16px}.method{margin-top:18px;padding:14px;background:#f0f5f2;border-radius:12px;font-size:14px;line-height:1.7;color:#405348}.method b{color:#1e3527}.result-head{padding:17px 22px;border-bottom:1px solid #e1e8e3}.result-head small{color:var(--main);font-weight:700}.empty{min-height:390px;display:grid;place-items:center;padding:30px;text-align:center;color:#607269;font-weight:700}.content{padding:22px}.table-wrap{overflow:auto;border:1px solid #dbe3de;border-radius:12px}table{width:100%;border-collapse:collapse;font-size:14px}th{background:var(--main);color:#fff;text-align:left}th,td{padding:12px 14px;border-top:1px solid #e2e8e4;line-height:1.6}thead th{border-top:0}td:first-child{width:36%;color:#263a2c;font-weight:700;vertical-align:top}tbody tr.key{background:var(--pale)}.note{margin-top:17px;padding:14px;border:1px solid var(--line);background:#fafcfb;border-radius:12px;color:#4d5c53;font-size:14px;line-height:1.7}.note b{color:var(--ink)}[hidden]{display:none!important}@media(max-width:820px){main{grid-template-columns:1fr}h1{font-size:23px}th,td{padding:10px;font-size:13px}}
  </style>
</head>
<body>
  <header><div><div class="tag">営業用</div><h1>NURO光 工事・特典スケジュール計算</h1><p>表示された日付を、お客様用PDFへ手書きで記入してください。</p></div></header>
  <main>
    <section class="card input">
      <h2>条件を入力</h2>
      <fieldset><legend>キャンペーン</legend><div class="choices campaigns">
        <button type="button" data-campaign="70" class="on">7万円</button><button type="button" data-campaign="60">6万円</button><button type="button" data-campaign="40">4万円</button><button type="button" data-campaign="20">2万円</button>
      </div></fieldset>
      <fieldset id="antennaWrap"><legend>テレビアンテナ工事</legend><div class="choices antenna"><button id="yes" class="on" type="button">あり</button><button id="no" type="button">なし</button></div></fieldset>
      <label id="dateLabel" for="baseDate">アンテナ工事業者からの電話日</label><input id="baseDate" type="date">
      <div class="method"><b>計算方法</b><div id="methodText">電話日から各工事を約14日間隔で計算します。</div></div>
    </section>
    <section class="card">
      <div class="result-head"><small id="campaignName">7万円サポート</small><h2>日付の計算結果</h2></div>
      <div id="empty" class="empty">日付を入力すると、ここに予定が表示されます</div>
      <div id="content" class="content" hidden><div class="table-wrap"><table><thead><tr><th>時期の目安</th><th>PDFに記入する内容</th></tr></thead><tbody id="rows"></tbody></table></div><div class="note"><b>確認事項</b><br><span id="noteText"></span></div></div>
    </section>
  </main>
  <script>
    let campaign='70',antenna=true;
    const $=id=>document.getElementById(id);
    const colors={70:['#83ad2e','#f3f8e8'],60:['#7faecb','#f1f7fb'],40:['#aa94bf','#f6f2f8'],20:['#cf7e98','#fbf0f4']};
    const names={70:'7万円 乗り換えサポート',60:'6万円キャッシュバック',40:'4万円キャッシュバック',20:'2万円キャッシュバック'};
    const addDays=(d,n)=>{const r=new Date(d);r.setDate(r.getDate()+n);return r};
    const addMonths=(d,n)=>{const r=new Date(d),day=r.getDate();r.setDate(1);r.setMonth(r.getMonth()+n);const last=new Date(r.getFullYear(),r.getMonth()+1,0).getDate();r.setDate(Math.min(day,last));return r};
    const monthEnd=(d,n)=>new Date(d.getFullYear(),d.getMonth()+n+1,0,12);
    const fmt=(d,s='頃')=>`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日${s}`;
    function refreshInputs(){
      const is70=campaign==='70';$('antennaWrap').hidden=!is70;
      $('dateLabel').textContent=is70&&antenna?'アンテナ工事業者からの電話日':'宅内工事日';
      $('methodText').textContent=is70?(antenna?'電話日 → 約14日後にアンテナ工事 → 約14日後に宅内工事 → 約14日後に屋外工事':'宅内工事日 → 約14日後に屋外工事'):'宅内工事日から、屋外工事・利用開始を約14日後として計算します。';
      $('campaignName').textContent=names[campaign];document.documentElement.style.setProperty('--main',colors[campaign][0]);document.documentElement.style.setProperty('--pale',colors[campaign][1]);
    }
    function chooseCampaign(value){campaign=value;document.querySelectorAll('[data-campaign]').forEach(b=>b.classList.toggle('on',b.dataset.campaign===value));$('baseDate').value='';refreshInputs();render()}
    function chooseAntenna(value){antenna=value;$('yes').classList.toggle('on',value);$('no').classList.toggle('on',!value);$('baseDate').value='';refreshInputs();render()}
    function cashbackRows(opening){
      const common=[['申込後、郵送（到着日は未定）','入会証を受け取る'],['入会証が届き次第','支払い方法・連絡先メールアドレスを早めに登録'],[fmt(monthEnd(opening,5),'頃まで'),'支払い方法・連絡先メールアドレスの登録完了期限']];
      if(campaign==='20')return [...common,[fmt(addMonths(opening,6),'頃から'),'20,000円の受取手続き（受取可能日から45日以内）']];
      const amount=campaign==='40'?'20,000円':'30,000円';return [...common,[fmt(addMonths(opening,6),'頃から'),`1回目：${amount}の受取手続き（45日以内）`],[fmt(addMonths(opening,12),'頃から'),`2回目：${amount}の受取手続き（45日以内）`]];
    }
    function render(){
      const value=$('baseDate').value;if(!value){$('empty').hidden=false;$('content').hidden=true;return}
      const [y,m,d]=value.split('-').map(Number),base=new Date(y,m-1,d,12);let rows=[],opening;
      if(campaign==='70'){
        const indoor=antenna?addDays(base,28):base;opening=addDays(indoor,14);
        if(antenna)rows.push([fmt(base,''),'アンテナ工事業者からの電話連絡',''],[fmt(addDays(base,14)),'アンテナ工事','key']);
        rows.push([fmt(indoor,antenna?'頃':''),'宅内工事','key'],[fmt(opening),'屋外工事・NURO光利用開始予定','key'],['NURO光開通後すぐ','現在の回線を解約',''],['解約後すぐ','違約金・工事費残債などの証明書を取得',''],[fmt(monthEnd(opening,3),'頃まで'),'支払い方法・メールアドレスの登録期限（5,000円CB）',''],[fmt(addMonths(opening,5),'頃から'),'5,000円の受取手続き（受取可能日から45日以内）',''],[fmt(monthEnd(opening,5),'頃まで'),'解約違約金証明書貼付シートの発送',''],['シート到着後すぐ','証明書を貼って返送',''],[fmt(monthEnd(opening,6),'頃まで'),'支払い方法の登録完了（最大7万円サポート）',''],[fmt(addMonths(opening,6),'頃から'),'最大7万円サポートの受取案内（案内後45日以内）','']);
        $('noteText').textContent='屋外工事日と利用開始日は目安です。実際の開通日によって、特典の期限・受取時期は前後します。';
      }else{
        opening=addDays(base,14);const cb=cashbackRows(opening).map(r=>[...r,'']);rows.push(cb[0],cb[1],[fmt(base,''),'宅内工事','key'],[fmt(opening),'屋外工事・利用開始','key'],...cb.slice(2));
        $('noteText').textContent='屋外工事・利用開始日は約14日後として計算した目安です。実際の利用開始日によって、登録期限と受取時期は前後します。';
      }
      $('rows').innerHTML=rows.map(r=>`<tr class="${r[2]||''}"><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('');$('empty').hidden=true;$('content').hidden=false;
    }
    document.querySelectorAll('[data-campaign]').forEach(b=>b.onclick=()=>chooseCampaign(b.dataset.campaign));$('yes').onclick=()=>chooseAntenna(true);$('no').onclick=()=>chooseAntenna(false);$('baseDate').onchange=render;refreshInputs();
  </script>
</body>
</html>
